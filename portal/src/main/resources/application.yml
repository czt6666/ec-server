  publicAlias: publicCert
  publicKeysStorePath: /publicCerts.store
  storePass: Webofd1
  licensePath: classpath:license.lic

#【必改项】
##################################IP及端口相关##################################################
server:
  port: 8080



##################################日志相关#####################################################
logging:
  config: classpath:logback-local.xml